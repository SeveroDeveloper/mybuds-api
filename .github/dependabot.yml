# Dependabot opens PRs to update dependencies; CI must pass before you merge them.
# Grouped and weekly so it doesn't flood the repo with one PR per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A package joins the FIRST group that matches it, so the families come first.
    groups:
      # Families that must always share a version: updated together, majors included.
      # (Separately, vitest 5 + coverage-v8 4 can't even install: PRs #7/#8.)
      vitest:
        patterns: ['vitest', '@vitest/*']
      nestjs:
        patterns: ['@nestjs/*']
      # Everything else: minor/patch in one PR; majors stay separate (they can break things).
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Prisma CLI and client must be the same exact version: update them together.
    # (Prisma 8 is a different API: a deliberate migration, not a Dependabot bump.)
    ignore:
      - dependency-name: 'prisma'
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]
      # Node's type definitions must match the Node we run (24, from .nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7.0 ships only the `tsc` binary; the Nest CLI needs the compiler API,
      # expected back in 7.1 (PR #2 failed on it). Dependabot will offer 7.1+ when it lands.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <7.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The node:24-slim base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 24 (.nvmrc); moving to a new major is a deliberate change.
      - dependency-name: node
        update-types: [version-update:semver-major]
