# Runs after every merge to main: builds the production image and publishes it to GHCR.
# Branch protection guarantees main already passed CI (PR + required checks, up to date).
# Next pieces will add: prisma migrate deploy → Koyeb deploy → smoke test of the public URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button, e.g. to retry a failed deploy

# Never two deploys at once; a newer merge waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR names must be lowercase.
  IMAGE: ghcr.io/severodeveloper/mybuds-api

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN (no personal token)
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Commit SHA = immutable tag: each deploy points at exactly one commit, and a
          # rollback is "deploy the previous SHA". `main` is a moving pointer for convenience.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A plain single-platform image: provenance attestations turn it into a multi-manifest
          # index that some platforms show or pull oddly. Revisit with signed attestations later.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
