# Runs after every merge to main: publish the image → migrate the DB → deploy on Render → verify.
# Branch protection guarantees main already passed CI (PR + required checks, up to date).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button, e.g. to retry a failed deploy

# Never two deploys at once; a newer merge waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR names must be lowercase.
  IMAGE: ghcr.io/severodeveloper/mybuds-api

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN (no personal token)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Commit SHA = immutable tag: each deploy points at exactly one commit, and a
          # rollback is "deploy the previous SHA". `main` is a moving pointer for convenience.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A plain single-platform image: provenance attestations turn it into a multi-manifest
          # index that some platforms show or pull oddly. Revisit with signed attestations later.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The production environment holds the secrets and only accepts runs from main.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the Prisma CLI is needed here; skip postinstall (no client generation).
      - run: npm ci --ignore-scripts

      # Migrations run BEFORE the new code goes live, so new code never meets an old schema.
      # (Schema changes must be backward compatible: expand → contract, see ARCHITECTURE §7.)
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # The deploy hook URL is a secret: GitHub masks it in logs, and we never echo it.
      # imgURL overrides the tag for this deploy only: Render runs exactly this commit's image.
      - name: Trigger Render deploy
        run: |
          curl --fail --silent --show-error --get "$HOOK" \
            --data-urlencode "imgURL=$IMAGE:$GITHUB_SHA" -o /dev/null
          echo "Render deploy requested for $IMAGE:$GITHUB_SHA"
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # The old version keeps answering 200 until Render swaps instances, so "200" alone
      # proves nothing. Wait until the public URL reports THIS commit and a healthy DB.
      - name: Smoke test production
        run: |
          for attempt in $(seq 1 60); do
            body=$(curl --silent --max-time 90 "$PUBLIC_URL/api/v1/health" || true)
            version=$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)
            db=$(echo "$body" | jq -r '.db // empty' 2>/dev/null || true)
            echo "attempt $attempt: version=${version:-?} db=${db:-?}"
            if [ "$version" = "$GITHUB_SHA" ] && [ "$db" = "ok" ]; then
              echo "Production is running $GITHUB_SHA with a healthy database."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report $GITHUB_SHA with db ok within ~10 minutes."
          exit 1
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
